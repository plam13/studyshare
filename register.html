<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Регистрация · StudyShare</title>
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
          <div class="card border-0 shadow-sm ss-auth-card">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill ss-auth-icon"></i>
                <h1 class="h3 mt-2 mb-1">Създай профил</h1>
                <p class="text-secondary mb-0">Присъедини се и споделяй учебни материали.</p>
              </div>

              <div id="register-success" class="alert alert-success d-none" role="status">
                <i class="bi bi-envelope-check me-2"></i>
                Регистрацията е успешна! Изпратихме ти имейл — потвърди адреса си и след това
                <a href="/login.html" class="alert-link">влез в профила си</a>.
              </div>

              <form id="register-form" novalidate>
                <div class="mb-3">
                  <label for="fullName" class="form-label">Име и фамилия</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="fullName" name="fullName" autocomplete="name" maxlength="100" required />
                    <div class="invalid-feedback"></div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Имейл</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="email" required />
                    <div class="invalid-feedback"></div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Парола</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required />
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="form-text">Поне 6 символа.</div>
                </div>

                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">Повтори паролата</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
                    <div class="invalid-feedback"></div>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                  <i class="bi bi-person-check me-1"></i>Регистрирай се
                </button>
              </form>

              <p class="text-center text-secondary mt-4 mb-0">
                Вече имаш профил? <a href="/login.html">Влез</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>
    <script type="module" src="/src/pages/register.js"></script>
  </body>
</html>
