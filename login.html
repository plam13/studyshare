<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Вход · StudyShare</title>
  </head>
  <body>
    <div id="app-header"></div>

    <main class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
          <div class="card border-0 shadow-sm ss-auth-card">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <i class="bi bi-box-arrow-in-right ss-auth-icon"></i>
                <h1 class="h3 mt-2 mb-1">Вход</h1>
                <p class="text-secondary mb-0">Добре дошъл отново в StudyShare!</p>
              </div>

              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Имейл</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="email" required />
                    <div class="invalid-feedback"></div>
                  </div>
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label">Парола</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required />
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Покажи паролата">
                      <i class="bi bi-eye"></i>
                    </button>
                    <div class="invalid-feedback"></div>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                  <i class="bi bi-box-arrow-in-right me-1"></i>Влез
                </button>
              </form>

              <p class="text-center text-secondary mt-4 mb-0">
                Нямаш профил? <a href="/register.html">Регистрирай се</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>
    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
