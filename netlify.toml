# Netlify build settings (SPA fallback is in public/_redirects)
[build]
  command = "npm run build"
  publish = "dist"
  # Free plan: every production deploy costs 15 of 300 monthly credits.
  # Build only when the last commit message contains "[deploy]" (exit 1 = build, exit 0 = skip).
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# Long-term caching for hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
