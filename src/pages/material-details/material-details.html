<section>
  <nav aria-label="Навигационна пътека">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/courses">Курсове</a></li>
      <li class="breadcrumb-item"><a href="/courses" data-field="course-link">Курс</a></li>
      <li class="breadcrumb-item active" aria-current="page" data-field="crumb">Материал</li>
    </ol>
  </nav>

  <div id="material-content"></div>
</section>

<template id="material-layout">
  <div class="ss-banner-gap" data-region="banner"></div>
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
        <h1 class="h3 ss-material-title mb-0" data-field="title"></h1>
        <div class="d-flex flex-wrap gap-2">
          <div data-region="share"></div>
          <div data-region="report"></div>
          <div class="d-flex gap-2" data-region="owner-actions" hidden>
            <a class="btn btn-outline-primary btn-sm" data-field="edit-link" href="#">
              <i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Редактирай
            </a>
            <button type="button" class="btn btn-outline-danger btn-sm" data-action="delete-material">
              <i class="bi bi-trash me-1" aria-hidden="true"></i>Изтрий
            </button>
          </div>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-3 small text-secondary mb-3" data-region="meta"></div>

      <div class="card mb-3">
        <div class="card-body">
          <h2 class="ss-label mb-2">Описание</h2>
          <p class="ss-material-description mb-0" data-field="description"></p>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body" data-region="rating"></div>
      </div>

      <div data-region="comments"></div>
    </div>

    <aside class="col-lg-4" aria-label="Файл">
      <div class="ss-win ss-tone-yellow ss-file-card">
        <div class="ss-win-bar" aria-hidden="true">
          <span class="ss-dot"></span><span class="ss-dot"></span><span class="ss-dot"></span>
          <span class="ss-win-title">file.info</span>
        </div>
        <div class="ss-win-body" data-region="file-card"></div>
      </div>
    </aside>
  </div>
</template>
