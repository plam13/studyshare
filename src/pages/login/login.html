<div class="row justify-content-center py-md-4">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <div class="ss-win ss-tone-yellow">
      <div class="ss-win-bar" aria-hidden="true">
        <span class="ss-dot"></span><span class="ss-dot"></span><span class="ss-dot"></span>
        <span class="ss-win-title">/login</span>
      </div>
      <div class="ss-win-body p-4 p-md-5">
        <div class="text-center mb-4">
          <span class="ss-icon-tile ss-tone-sky ss-auth-icon"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i></span>
          <h1 class="h3 mt-2 mb-1">Вход</h1>
          <p class="text-secondary mb-0">Добре дошъл отново в StudyShare!</p>
        </div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Имейл</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
              <input type="email" class="form-control" id="email" name="email" autocomplete="email" required />
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Парола</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
              <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required />
              <button class="btn btn-outline-secondary" type="button" data-action="toggle-password" aria-label="Покажи паролата">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Влез
          </button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
          Нямаш профил? <a href="/register" data-keep-redirect>Регистрирай се</a>
        </p>
      </div>
    </div>
  </div>
</div>
