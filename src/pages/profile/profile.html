<section>
  <h1 class="h3 mb-4"><i class="bi bi-person-circle me-2" aria-hidden="true"></i>Моят профил</h1>

  <div class="row g-4">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 shadow-sm text-center">
        <div class="card-body p-4">
          <div class="ss-profile-avatar mb-3" data-field="avatar"></div>
          <h2 class="h5 mb-1 text-break" data-field="fullName"></h2>
          <p class="text-secondary small mb-2 text-break" data-field="email"></p>
          <span class="badge rounded-pill" data-field="role"></span>

          <hr />

          <form id="avatar-form" novalidate>
            <label for="avatar" class="form-label fw-semibold">Профилна снимка</label>
            <input type="file" class="form-control form-control-sm" id="avatar" name="avatar" aria-describedby="avatar-help" />
            <div class="invalid-feedback text-start"></div>
            <div id="avatar-help" class="form-text">JPG, PNG, WEBP или GIF — до 2 MB.</div>
            <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
              <button type="submit" class="btn btn-primary btn-sm">
                <i class="bi bi-upload me-1" aria-hidden="true"></i>Качи снимка
              </button>
              <button type="button" class="btn btn-outline-danger btn-sm" data-action="remove-avatar" hidden>
                <i class="bi bi-trash me-1" aria-hidden="true"></i>Премахни
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-7 col-lg-8">
      <form id="name-form" class="card border-0 shadow-sm mb-4" novalidate>
        <div class="card-body p-4">
          <h2 class="h5 mb-3"><i class="bi bi-pencil-square me-2" aria-hidden="true"></i>Лични данни</h2>
          <div class="mb-3">
            <label for="fullName" class="form-label">Име и фамилия</label>
            <input type="text" class="form-control" id="fullName" name="fullName" autocomplete="name" maxlength="100" required />
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Имейл</label>
            <input type="email" class="form-control" id="email" readonly aria-describedby="email-help" />
            <div id="email-help" class="form-text">Имейлът се използва за вход и не може да бъде променян.</div>
          </div>
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check2-circle me-1" aria-hidden="true"></i>Запази
            </button>
          </div>
        </div>
      </form>

      <section aria-labelledby="my-materials-title">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 id="my-materials-title" class="h5 mb-0">
            <i class="bi bi-files me-2" aria-hidden="true"></i>Моите материали
            <span class="badge text-bg-light border" data-field="materials-count"></span>
          </h2>
          <a class="btn btn-outline-primary btn-sm" href="/materials/add"><i class="bi bi-cloud-arrow-up me-1" aria-hidden="true"></i>Качи материал</a>
        </div>
        <div id="profile-materials"></div>
      </section>
    </div>
  </div>
</section>
