<section class="row justify-content-center">
  <div class="col-lg-9 col-xl-8">
    <nav aria-label="Навигационна пътека">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/courses">Курсове</a></li>
        <li class="breadcrumb-item active" aria-current="page" data-field="crumb">Качване на материал</li>
      </ol>
    </nav>

    <h1 class="h3 mb-1">
      <i class="bi bi-cloud-arrow-up me-2" aria-hidden="true" data-field="title-icon"></i><span data-field="form-title">Качване на материал</span>
    </h1>
    <p class="text-secondary mb-4" data-field="form-lead">Сподели записки, решени задачи или презентации с колегите си.</p>

    <div id="material-form-content"></div>
  </div>
</section>

<template id="material-form-template">
  <form id="material-form" class="card" novalidate>
    <div class="card-body p-4">
      <div class="mb-3">
        <label for="courseId" class="form-label">Курс</label>
        <select class="form-select" id="courseId" name="courseId" required>
          <option value="">Избери курс…</option>
        </select>
        <div class="invalid-feedback"></div>
      </div>

      <div class="mb-3">
        <label for="title" class="form-label">Заглавие</label>
        <input type="text" class="form-control" id="title" name="title" maxlength="150" required
               aria-describedby="title-help" placeholder="напр. Лекция 3 — Цикли" />
        <div class="invalid-feedback"></div>
        <div id="title-help" class="form-text">Между 3 и 150 символа.</div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Описание <span class="text-secondary fw-normal">(по желание)</span></label>
        <textarea class="form-control" id="description" name="description" rows="5" maxlength="2000"
                  aria-describedby="description-counter"></textarea>
        <div class="invalid-feedback"></div>
        <div id="description-counter" class="form-text text-end" aria-live="polite">0 / 2000</div>
      </div>

      <div class="mb-4">
        <label for="file" class="form-label" data-field="file-label">Файл</label>
        <div class="ss-current-file mb-2" data-field="current-file" hidden></div>
        <input type="file" class="form-control" id="file" name="file" aria-describedby="file-help" />
        <div class="invalid-feedback"></div>
        <div id="file-help" class="form-text">PDF, Word, PowerPoint, Excel, TXT или ZIP — до 20 MB.</div>
        <div class="ss-selected-file small mt-2" data-field="selected-file" hidden></div>
      </div>

      <div class="d-flex flex-wrap gap-2 justify-content-end">
        <a class="btn btn-outline-secondary" href="/courses" data-field="cancel">Отказ</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check2-circle me-1" aria-hidden="true"></i><span data-field="submit-label">Качи материала</span>
        </button>
      </div>
    </div>
  </form>
</template>
