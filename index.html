<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyShare – споделяне на учебни материали по курсове." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StudyShare</title>
    <!-- Link previews (Discord, Facebook, Viber…). For /materials/:id and /courses/:id the
         Netlify Edge Function netlify/edge-functions/link-preview.js replaces them for crawlers. -->
    <meta property="og:site_name" content="StudyShare" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:title" content="StudyShare – учебни материали по курсове" />
    <meta property="og:description" content="Записки, решени задачи и презентации, споделени от студенти. Разгледай курсовете и изтегли материалите." />
    <meta property="og:url" content="https://studyshare-learn.netlify.app/" />
    <meta property="og:image" content="https://studyshare-learn.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StudyShare – сподели учебни материали по курсове" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyShare – учебни материали по курсове" />
    <meta name="twitter:description" content="Записки, решени задачи и презентации, споделени от студенти. Разгледай курсовете и изтегли материалите." />
    <meta name="twitter:image" content="https://studyshare-learn.netlify.app/og-image.png" />
    <meta name="twitter:image:alt" content="StudyShare – сподели учебни материали по курсове" />
  </head>
  <body>
    <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-light" href="#app">Към съдържанието</a>
    <div id="app-header"></div>

    <main id="app" class="container py-4" tabindex="-1">
      <div class="ss-loader" role="status">
        <div class="spinner-border text-primary" aria-hidden="true"></div>
        <span class="visually-hidden">Зареждане…</span>
      </div>
    </main>

    <div id="app-footer"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
